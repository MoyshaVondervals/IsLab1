spring:
  application:
    name: islab1
  datasource:
    type: org.apache.commons.dbcp2.BasicDataSource
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres}
    driverClassName: org.postgresql.Driver
    username: ${SPRING_DATASOURCE_USERNAME:myuser}
    password: ${SPRING_DATASOURCE_PASSWORD:secret}
    dbcp2:
      initial-size: ${DBCP2_INITIAL_SIZE:4}
      max-total: ${DBCP2_MAX_TOTAL:16}
      max-idle: ${DBCP2_MAX_IDLE:8}
      min-idle: ${DBCP2_MIN_IDLE:2}
      max-wait-millis: ${DBCP2_MAX_WAIT_MILLIS:30000}
      pool-prepared-statements: true
      validation-query: ${DBCP2_VALIDATION_QUERY:SELECT 1}
      test-on-borrow: true
      test-while-idle: true
      time-between-eviction-runs-millis: 30000
      min-evictable-idle-time-millis: 60000
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        default_schema: ${SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA:s409361}
        format_sql: false
        cache:
          use_second_level_cache: true
          use_query_cache: true
          use_minimal_puts: true
          region.factory_class: org.infinispan.hibernate.cache.v62.InfinispanRegionFactory
          infinispan:
            cfg: infinispan-config.xml
        generate_statistics: true
      jakarta:
        persistence:
          sharedCache:
            mode: ENABLE_SELECTIVE
  flyway:
    enabled: true
    locations: classpath:db/migration
    out-of-order: true
    baseline-on-migrate: ${SPRING_FLYWAY_BASELINE_ON_MIGRATE:false}
    baseline-version: ${SPRING_FLYWAY_BASELINE_VERSION:1}
    default-schema: ${SPRING_FLYWAY_DEFAULT_SCHEMA:${SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA:s409361}}
    schemas: ${SPRING_FLYWAY_SCHEMAS:${SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA:s409361}}
server:
  port: ${SERVER_PORT:8054}
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
app:
  cache:
    stats-logging-enabled: ${APP_CACHE_STATS_LOGGING_ENABLED:false}
  storage:
    endpoint: ${APP_STORAGE_ENDPOINT:http://localhost:9000}
    access-key: ${APP_STORAGE_ACCESS_KEY:minio}
    secret-key: ${APP_STORAGE_SECRET_KEY:minio12345}
    bucket: ${APP_STORAGE_BUCKET:dragon-imports}
    region: ${APP_STORAGE_REGION:us-east-1}
    secure: ${APP_STORAGE_SECURE:false}
    presigned-url-ttl-seconds: ${APP_STORAGE_PRESIGNED_TTL_SECONDS:900}
token:
  signing:
    key: ${TOKEN_SIGNING_KEY:53A73E5F1C4E0A2D3B5F2D784E6A1B423D6F247D1F6E5C3A596D635A75327855}
