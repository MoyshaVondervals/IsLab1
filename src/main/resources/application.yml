spring:
  application:
    name: islab1
  datasource:
    type: org.apache.commons.dbcp2.BasicDataSource
    url: jdbc:postgresql://localhost:5432/postgres
    driverClassName: org.postgresql.Driver
    username: myuser
    password: secret
    dbcp2:
      initial-size: 4
      max-total: 16
      max-idle: 8
      min-idle: 2
      max-wait-millis: 30000
      pool-prepared-statements: true
      validation-query: SELECT 1
      test-on-borrow: true
      test-while-idle: true
      time-between-eviction-runs-millis: 30000
      min-evictable-idle-time-millis: 60000
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        default_schema: public
        format_sql: false
        cache:
          use_second_level_cache: true
          use_query_cache: true
          use_minimal_puts: true
          region.factory_class: org.infinispan.hibernate.cache.v62.InfinispanRegionFactory
          infinispan:
            cfg: infinispan-config.xml
        generate_statistics: true
      jakarta:
        persistence:
          sharedCache:
            mode: ENABLE_SELECTIVE
  flyway:
    enabled: true
    locations: classpath:db/migration
    out-of-order: true
    baseline-on-migrate: false
    baseline-version: 1
    default-schema: public
    schemas: public
server:
  port: 8080
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
app:
  cache:
    stats-logging-enabled: false
  storage:

    endpoint: http://localhost:9000
    access-key: minio
    secret-key: minio12345
    bucket: dragon-imports
    region: us-east-1
    secure: false
    presigned-url-ttl-seconds: 900
token:
  signing:
    key: 53A73E5F1C4E0A2D3B5F2D784E6A1B423D6F247D1F6E5C3A596D635A75327855
